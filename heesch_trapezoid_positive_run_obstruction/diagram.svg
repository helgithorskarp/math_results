<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 395" role="img" aria-labelledby="title desc">
<title id="title">Four old copies force overlapping mates, n=12</title>
<desc id="desc">Skeleton diagram. The fourteen-unit positive run forces its two bottom mates at cut two; the fourth old copy forces a flat mate, which overlaps the right bottom mate.</desc>
<rect width="740" height="395" fill="white"/>
<g font-family="sans-serif" font-size="14">
<text x="20" y="25" font-weight="bold">Four-copy obstruction, n=12 (straight skeletons)</text>
