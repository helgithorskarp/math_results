<text x="92.50" y="185.41" text-anchor="middle">S1</text>
<polygon points="170.00,285.00 390.00,285.00 390.00,250.36 150.00,250.36" fill="#c8e5d0" stroke="#334155" stroke-width="1.5"/>
<text x="275.00" y="267.68" text-anchor="middle">S2</text>
<polygon points="630.00,250.36 390.00,250.36 390.00,285.00 610.00,285.00" fill="#f9dec0" stroke="#334155" stroke-width="1.5"/>
<text x="505.00" y="267.68" text-anchor="middle">S3</text>
<polygon points="650.00,285.00 410.00,285.00 410.00,319.64 630.00,319.64" fill="#e9cef1" stroke="#334155" stroke-width="1.5"/>
<text x="525.00" y="302.32" text-anchor="middle">S4</text>
<polygon points="190.00,319.64 410.00,319.64 410.00,285.00 170.00,285.00" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="410.00,285.00 170.00,285.00 170.00,319.64 390.00,319.64" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="130.0" y1="285.0" x2="410.0" y2="285.0" stroke="#d97706" stroke-width="5"/>
<circle cx="130.0" cy="285.0" r="2" fill="#78350f"/>
