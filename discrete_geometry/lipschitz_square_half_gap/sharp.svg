<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Sharp half-gap square example</title>
  <desc id="desc">An eight-edge blue curve with vertical gap one, a dashed contained diamond, and its unique red square of side one half.</desc>
  <rect width="640" height="420" fill="white"/>
  <path d="M80 205 H560 M320 30 V380" stroke="#ddd" fill="none"/>
  <path d="M95 205 L245 130 L320 55 L395 130 L545 205 L395 280 L320 355 L245 280 Z" fill="#edf4fa" stroke="#176595" stroke-width="3"/>
  <path d="M170 205 L320 55 L470 205 L320 355 Z" fill="none" stroke="#758898" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M245 130 H395 V280 H245 Z" fill="#cf392510" stroke="#b83625" stroke-width="3"/>
  <g fill="#b83625"><circle cx="245" cy="130" r="4"/><circle cx="395" cy="130" r="4"/><circle cx="245" cy="280" r="4"/><circle cx="395" cy="280" r="4"/></g>
  <g font-family="sans-serif" font-size="16" fill="#263746">
    <text x="18" y="24">Maximum gap M = 1</text>
    <text x="263" y="118" fill="#b83625">side = 1/2</text>
    <text x="66" y="231">−3/4</text><text x="528" y="231">3/4</text>
    <text x="335" y="52">(0, 1/2)</text><text x="335" y="370">(0, −1/2)</text>
    <text x="146" y="405">Exact coordinates and proof in PROOF.md</text>
  </g>
</svg>
