<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-labelledby="title desc">
<title id="title">The sharp pentagon and its unique inscribed square</title>
<desc id="desc">The roof has slopes one half, one, minus one, and minus one half. Its height is one; the unique square has side two thirds. Both axes use the same scale.</desc>
<rect width="620" height="330" fill="white"/>
<path d="M60 260 L260 160 L310 110 L360 160 L560 260 Z" fill="#f1f5f9" stroke="#172b4d" stroke-width="3"/>
<rect x="260" y="160" width="100" height="100" fill="#dbeafe" fill-opacity="0.8" stroke="#2563eb" stroke-width="3"/>
<g fill="#172b4d" font-family="sans-serif" font-size="16">
<text x="310" y="40" text-anchor="middle">Sharp affine-branch square-size bound</text>
<text x="310" y="92" text-anchor="middle">(0, 1)</text>
<text x="232" y="150" text-anchor="end">(−1/3, 2/3)</text>
<text x="388" y="150">(1/3, 2/3)</text>
<text x="60" y="286" text-anchor="middle">(−5/3, 0)</text>
<text x="560" y="286" text-anchor="middle">(5/3, 0)</text>
<text x="310" y="217" text-anchor="middle" fill="#1d4ed8">side 2/3</text>
<text x="310" y="314" text-anchor="middle">M = 1; no larger or rotated square is inscribed.</text>
</g>
</svg>
